services:
  db:
    image: postgres:15-alpine
    container_name: vetpro-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-vetpro}
    ports:
      - "${VETPRO_DB_PORT:-5435}:5432"
    volumes:
      - vetpro_pg_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./vetpro-backend
      dockerfile: Dockerfile
    container_name: vetpro-backend-prod
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PORT: ${PORT:-3000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-vetpro}?schema=public}
      JWT_SECRET: ${JWT_SECRET:?Error: JWT_SECRET no está definido. Genera uno con: openssl rand -hex 64}
      NODE_ENV: production
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://vetpro.danielflorez.dev,http://localhost:4200,http://localhost:8080}
      APP_URL: ${APP_URL:-https://vetpro.danielflorez.dev}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      WOMPI_PUBLIC_KEY: ${WOMPI_PUBLIC_KEY:-}
      WOMPI_PRIVATE_KEY: ${WOMPI_PRIVATE_KEY:-}
      WOMPI_INTEGRITY_SECRET: ${WOMPI_INTEGRITY_SECRET:-}
      WOMPI_EVENTS_SECRET: ${WOMPI_EVENTS_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - vetpro_uploads:/app/uploads
    ports:
      - "${VETPRO_BACKEND_PORT:-3000}:3000"

  frontend:
    build:
      context: ./vetpro-angular/vetpro
      dockerfile: Dockerfile
    container_name: vetpro-frontend-prod
    restart: unless-stopped
    ports:
      - "${VETPRO_FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  vetpro_pg_data:
  vetpro_uploads:

