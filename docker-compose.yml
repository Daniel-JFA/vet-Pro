services:
  db:
    image: postgres:15-alpine
    container_name: vetpro-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-vetpro}
    ports:
      - "${VETPRO_DB_PORT:-5435}:5432"
    volumes:
      - vetpro_pg_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./vetpro-backend
      dockerfile: Dockerfile
    container_name: vetpro-backend-prod
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PORT: ${PORT:-3000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/vetpro?schema=public}
      JWT_SECRET: ${JWT_SECRET:-vetpro_super_secret_signing_key_2026_dev}
      NODE_ENV: production
    ports:
      - "${VETPRO_BACKEND_PORT:-3000}:3000"

  frontend:
    build:
      context: ./vetpro-angular/vetpro
      dockerfile: Dockerfile
    container_name: vetpro-frontend-prod
    restart: unless-stopped
    ports:
      - "${VETPRO_FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  vetpro_pg_data:
