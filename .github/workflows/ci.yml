name: CI - build & push

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ${{ secrets.REGISTRY }}
      REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node for frontend
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & build frontend
        working-directory: ./vetpro-frontend
        run: |
          npm ci
          npm run build -- --configuration=production || npm run build

      - name: Set up Node for backend
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & build backend
        working-directory: ./vetpro-backend
        run: |
          npm ci --legacy-peer-deps || npm ci
          npm run build

      - name: Login to registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./vetpro-frontend
          push: true
          tags: |
            ${{ secrets.REGISTRY }}/vetpro-frontend:latest
            ${{ secrets.REGISTRY }}/vetpro-frontend:${{ github.sha }}

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./vetpro-backend
          push: true
          tags: |
            ${{ secrets.REGISTRY }}/vetpro-backend:latest
            ${{ secrets.REGISTRY }}/vetpro-backend:${{ github.sha }}
