name: CI - build & test

# Bloquea el merge/deploy si algo de esto falla. Hasta 2026-09-30 este workflow
# fallaba siempre (las pruebas del backend no tenían base de datos) y el E2E
# nunca llegó a ejecutarse, así que un formulario roto llegó a producción.

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rutas del frontend existen en el backend y formularios ligados
        run: python3 scripts/check_frontend_contract.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./vetpro-angular/vetpro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build -- --configuration=production
      - run: npx ng test --watch=false

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: vetpro
          POSTGRES_PASSWORD: vetpro
          POSTGRES_DB: vetpro_test
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd "pg_isready -U vetpro -d vetpro_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://vetpro:vetpro@localhost:5432/vetpro_test
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789abcdef0123456789abcdef
      NODE_ENV: test
    defaults:
      run:
        working-directory: ./vetpro-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - run: npx prisma migrate deploy
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    needs: [contract, frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - name: Levantar stack real (db + backend + frontend)
        run: docker compose -f .github/e2e/docker-compose.yml up -d --build --wait

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias del frontend
        working-directory: ./vetpro-angular/vetpro
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: E2E contra el backend real
        working-directory: ./vetpro-angular/vetpro
        env:
          E2E_REAL: '1'
          PLAYWRIGHT_BASE_URL: http://localhost:8080
        run: npx playwright test e2e/real-backend.spec.ts --project=chromium

      - name: Logs del backend si falla
        if: failure()
        run: docker compose -f .github/e2e/docker-compose.yml logs backend --tail=200

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: vetpro-angular/vetpro/playwright-report
