name: CD - deploy to prod

on:
  workflow_run:
    workflows: ["CI - build & push"]
    branches: [main]
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT || 22 }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            echo "Deploy started on $(date)"
            cd /home/djfa/Dev/projects/Propios/Vet
            git pull origin main
            docker compose pull --ignore-pull-failures
            docker compose up -d --build --remove-orphans
            # Run pending migrations safely (no seed)
            docker compose exec -T backend npx prisma migrate deploy
            # healthcheck — backend on port 3000
            for i in {1..20}; do
              if curl -sf http://127.0.0.1:3000/api/health | grep -q '"status":"ok"'; then
                echo "Healthy after ${i} attempts"
                exit 0
              fi
              sleep 3
            done
            echo "Healthcheck failed" >&2
            exit 2
