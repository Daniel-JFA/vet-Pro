server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Compresión GZIP para optimizar el rendimiento y la velocidad de carga
    gzip on;
    gzip_http_version 1.1;
    gzip_disable "MSIE [1-6]\.";
    gzip_min_length 1100;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/javascript text/xml application/xml application/xml+rss;
    gzip_buffers 16 8k;
    gzip_comp_level 6;

    # Soporte para Enrutamiento SPA de Angular (HTML5 routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html NUNCA debe cachearse: referencia los archivos JS/CSS con hash
    # de cada build. Si el navegador cachea index.html, sigue pidiendo los
    # bundles viejos (que ya no existen tras un nuevo despliegue) o, peor,
    # sigue ejecutando código JS desactualizado con bugs ya corregidos en el
    # servidor sin que el usuario se entere.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Proxy para redirigir las peticiones de la API al contenedor Backend
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Almacenamiento en caché del navegador de archivos estáticos
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, no-transform";
    }

    # Manejo de páginas de error del sistema
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
